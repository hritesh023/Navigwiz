version: "3.9"

# Optimized for Oracle Cloud Free Tier (4 ARM cores, 24 GB RAM)
# Strips Nginx, combines worker into API, reduces concurrency

services:
  api:
    build: .
    container_name: navigwiz-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - data:/app/data
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "2"

  worker:
    build: .
    container_name: navigwiz-worker
    env_file:
      - .env
    volumes:
      - data:/app/data
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "1"

  beat:
    build: .
    container_name: navigwiz-beat
    env_file:
      - .env
    volumes:
      - data:/app/data
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.25"

  redis:
    image: redis:7-alpine
    container_name: navigwiz-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.25"

volumes:
  redis-data:
  data:
