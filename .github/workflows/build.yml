name: Build and Deploy Navigwiz Browser

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  FLUTTER_VERSION: '3.16.0'
  JAVA_VERSION: '17'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Run tests
      run: flutter test --coverage
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: coverage/lcov.info

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'release'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Build APK
      run: |
        flutter build apk \
          --release \
          --obfuscate \
          --split-debug-info=build/debug-info/ \
          --tree-shake-icons \
          --dart-define=OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
          --dart-define=WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}
          
    - name: Build App Bundle
      run: |
        flutter build appbundle \
          --release \
          --obfuscate \
          --split-debug-info=build/debug-info/ \
          --tree-shake-icons \
          --dart-define=OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
          --dart-define=WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}
          
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: android-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        
    - name: Upload App Bundle
      uses: actions/upload-artifact@v3
      with:
        name: android-appbundle
        path: build/app/outputs/bundle/release/app-release.aab

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'release'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Build Windows
      run: |
        flutter build windows \
          --release \
          --obfuscate \
          --split-debug-info=build/debug-info/ \
          --tree-shake-icons \
          --dart-define=OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
          --dart-define=WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}
          
    - name: Create Windows installer
      run: |
        cd build/windows/runner/Release
        makensis installer.nsi
        
    - name: Upload Windows build
      uses: actions/upload-artifact@v3
      with:
        name: windows-installer
        path: build/windows/runner/Release/navigwiz-browser-setup.exe

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Build Web
      run: |
        flutter build web \
          --release \
          --web-renderer=html \
          --dart-define=OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
          --dart-define=WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}
          
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build/web

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  deploy:
    name: Deploy to Stores
    runs-on: ubuntu-latest
    needs: [build-android, build-windows]
    if: github.event_name == 'release'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download Android artifacts
      uses: actions/download-artifact@v3
      with:
        name: android-appbundle
        path: ./artifacts/android
        
    - name: Download Windows artifacts
      uses: actions/download-artifact@v3
      with:
        name: windows-installer
        path: ./artifacts/windows
        
    - name: Deploy to Google Play Console
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        packageName: com.navigwiz.browser
        releaseFiles: ./artifacts/android/app-release.aab
        track: production
        status: completed
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./artifacts/android/app-release.apk
          ./artifacts/windows/navigwiz-browser-setup.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
