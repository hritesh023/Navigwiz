name: Deploy AI Worker

on:
  push:
    branches: [ main ]
    paths:
      - 'ai-worker/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'ai-worker/**'
  release:
    types: [ published ]

env:
  WORKER_NAME: acronous-ai
  DIRECTORY: ai-worker

jobs:
  test:
    name: Test AI Worker
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ${{ env.DIRECTORY }}/package-lock.json
        
    - name: Install dependencies
      run: |
        cd ${{ env.DIRECTORY }}
        npm ci
        
    - name: Run tests
      run: |
        cd ${{ env.DIRECTORY }}
        npm test
        
    - name: Lint code
      run: |
        cd ${{ env.DIRECTORY }}
        npm run lint || true

  deploy:
    name: Deploy AI Worker
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ${{ env.DIRECTORY }}/package-lock.json
        
    - name: Install wrangler
      run: npm install -g wrangler@latest
      
    - name: Install dependencies
      run: |
        cd ${{ env.DIRECTORY }}
        npm ci
        
    - name: Build worker
      run: |
        cd ${{ env.DIRECTORY }}
        npm run build 2>/dev/null || echo "No build step configured"
        
    - name: Deploy to Cloudflare
      run: |
        cd ${{ env.DIRECTORY }}
        npx wrangler deploy --env production
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        
    - name: Verify deployment
      run: |
        cd ${{ env.DIRECTORY }}
        curl -f https://ai.acronous.com/health || echo "Health check failed - may be expected if worker is still deploying"
        
    - name: Update Acronous landing page config
      run: |
        cd Navigwiz
        echo "AI worker deployed to ai.acronous.com"
      env:
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './${{ env.DIRECTORY }}'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'