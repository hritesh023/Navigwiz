<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
<meta name="description" content="Navigwiz is an open-source standalone browser with custom Navigwiz search results and Apex Ai.">
  <meta name="keywords" content="Navigwiz, Apex Ai, AI search engine, open source browser">
  <meta name="theme-color" content="#8B5CF6">
<meta property="og:title" content="Navigwiz">
  <meta property="og:description" content="Open-source browser with custom Navigwiz search results and Apex Ai.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Navigwiz">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Navigwiz</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
  /* AcronousPay — web bridge for in-app Razorpay checkout (called from Dart
     via dart:js_interop; checkout.js is loaded lazily so normal page loads
     stay fast). Secrets never appear here: the server created the order. */
  window.AcronousPay = {
    ensure: function (cb) {
      if (window.Razorpay) { cb(null); return; }
      var s = document.createElement('script');
      s.src = 'https://checkout.razorpay.com/v1/checkout.js';
      s.onload = function () { cb(null); };
      s.onerror = function () { cb(new Error('load')); };
      document.head.appendChild(s);
    },
    open: function (opts, onOk, onErr) {
      this.ensure(function (e) {
        if (e || !window.Razorpay) { onErr({ message: 'Could not load the payment gateway. Check your connection and retry.' }); return; }
        try {
          var rzp = new window.Razorpay({
            key: opts.key, amount: opts.amount, currency: opts.currency || 'INR',
            name: 'Acronous', description: opts.description || 'Plan',
            order_id: opts.order_id, theme: { color: opts.color || '#f59e0b' },
            modal: { ondismiss: function () { onErr({ cancelled: true }); } },
            handler: function (r) { onOk(r); }
          });
          rzp.on('payment.failed', function (r) {
            onErr({ message: (r && r.error && r.error.description) || 'Payment failed. No money was deducted for a failed payment.' });
          });
          rzp.open();
        } catch (err) { onErr({ message: String(err) }); }
      });
    }
  };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
