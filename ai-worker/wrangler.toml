name = "navigwiz-ai"
main = "src/index.js"
compatibility_date = "2026-07-01"

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "production"
CONTABO_LLM_URL = "https://brain.acronous.com"
CONTABO_LLM_MODEL = "qwen2.5:1.5b"
CONTABO_LLM_KEY = ""

[env.production]
ai = { binding = "AI" }
vars = { SEARCH_ENABLED = "true", ENVIRONMENT = "production", CONTABO_LLM_URL = "https://brain.acronous.com", CONTABO_LLM_MODEL = "qwen2.5:1.5b", CONTABO_LLM_KEY = "" }
routes = [
  { pattern = "navigwiz-ai.acronous.com", custom_domain = true },
]

[env.development]
vars = { SEARCH_ENABLED = "false", ENVIRONMENT = "development" }
