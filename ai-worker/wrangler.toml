name = "navigwiz-ai"
main = "src/index.js"
compatibility_date = "2026-07-01"

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "production"
ORACLE_LLM_URL = "https://oracle.acronous.com"
ORACLE_LLM_MODEL = "qwen2.5:1.5b"
ORACLE_LLM_KEY = ""
# Optional: Brave Search Data API key for fast general-web results.
# Without it, search uses Wikipedia + LLM knowledge. Set via:
#   wrangler secret put BRAVE_API_KEY --env production
BRAVE_API_KEY = ""

[env.production]
ai = { binding = "AI" }
vars = { SEARCH_ENABLED = "true", ENVIRONMENT = "production", ORACLE_LLM_URL = "https://oracle.acronous.com", ORACLE_LLM_MODEL = "qwen2.5:1.5b", ORACLE_LLM_KEY = "", BRAVE_API_KEY = "" }
routes = [
  { pattern = "navigwiz-ai.acronous.com", custom_domain = true },
]

[env.development]
vars = { SEARCH_ENABLED = "false", ENVIRONMENT = "development" }
